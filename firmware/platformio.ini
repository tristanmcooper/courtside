; Courtside node — ESP32-S3-WROOM (Lonely Binary Gold Edition)
; Port: the CH34x UART bridge shows up as /dev/cu.wchusbserial10 on this Mac.
; If it changes, run `ls /dev/cu.*` and update both lines below.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

upload_port = /dev/cu.wchusbserial10
monitor_port = /dev/cu.wchusbserial10

build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    adafruit/Adafruit MLX90614 Library@^2.1.5
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/DHT sensor library


